<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gravityless</title>
    <style>
      :root {
        --bg: #050816;
        --bg2: #0d1326;
        --panel: rgba(18, 23, 38, 0.72);
        --panel-border: rgba(148, 163, 184, 0.2);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --cyan: #67e8f9;
        --blue: #60a5fa;
        --purple: #a78bfa;
        --highlight: #c4b5fd;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Inter, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(96, 165, 250, 0.18), transparent 22%),
          radial-gradient(circle at bottom right, rgba(167, 139, 250, 0.18), transparent 20%),
          linear-gradient(135deg, var(--bg), var(--bg2));
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .scene {
        position: relative;
        width: min(1100px, 90vw);
        height: min(700px, 80vh);
        border: 1px solid var(--panel-border);
        border-radius: 28px;
        background: rgba(10, 14, 24, 0.5);
        box-shadow: 0 30px 60px rgba(15, 23, 42, 0.7);
        overflow: hidden;
        backdrop-filter: blur(12px);
      }

      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(1px);
        opacity: 0.7;
        animation: float 20s ease-in-out infinite alternate;
      }

      .orb.one {
        width: 260px; height: 260px;
        top: -40px; right: 10%;
        background: radial-gradient(circle at 30% 30%, rgba(103, 232, 249, 0.7), rgba(96, 165, 250, 0.2) 55%, transparent 70%);
      }

      .orb.two {
        width: 320px; height: 320px;
        bottom: -90px; left: -20px;
        background: radial-gradient(circle at 30% 30%, rgba(167, 139, 250, 0.7), rgba(96, 165, 250, 0.18) 50%, transparent 72%);
        animation-delay: 2s;
      }

      .content {
        position: relative;
        z-index: 2;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .panel {
        width: min(760px, 82%);
        padding: clamp(1.8rem, 3vw, 3rem);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 22px;
        background: rgba(15, 23, 42, 0.35);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.45rem 0.9rem;
        border-radius: 999px;
        border: 1px solid rgba(103, 232, 249, 0.22);
        background: rgba(103, 232, 249, 0.06);
        color: var(--cyan);
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-size: 0.68rem;
        font-weight: 700;
      }

      .eyebrow::before {
        content: "";
        width: 0.5rem; height: 0.5rem;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--cyan), var(--purple));
        box-shadow: 0 0 12px rgba(103, 232, 249, 0.8);
      }

      h1 {
        margin: 1.25rem 0 0.8rem;
        font-size: clamp(3rem, 7vw, 7rem);
        line-height: 0.92;
        letter-spacing: -0.07em;
        font-weight: 900;
      }

      .gradient {
        background: linear-gradient(135deg, var(--text), #c4b5fd 40%, var(--cyan));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        max-width: 48rem;
        margin: 0;
        color: var(--muted);
        font-size: clamp(1rem, 1.8vw, 1.25rem);
        line-height: 1.7;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        margin-top: 2rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.9rem 1.5rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn.primary {
        background: linear-gradient(135deg, var(--cyan), var(--purple));
        color: #0b1120;
        box-shadow: 0 16px 32px rgba(103, 232, 249, 0.25);
      }

      .btn.secondary {
        border: 1px solid rgba(148, 163, 184, 0.24);
        background: rgba(15, 23, 42, 0.25);
        color: var(--text);
      }

      .stats {
        display: flex;
        gap: 1.5rem;
        flex-wrap: wrap;
        margin-top: 2rem;
      }

      .stat {
        min-width: 120px;
      }

      .value {
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--text);
      }

      .label {
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      @keyframes float {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        100% { transform: translate3d(20px, -30px, 0) scale(1.08); }
      }

      @media (max-width: 720px) {
        .scene { height: 100vh; width: 100vw; border-radius: 0; }
        .panel { width: 90%; }
        .stats { gap: 1rem; }
      }
    </style>
  </head>
  <body>
    <div class="scene" aria-label="gravityless landing page">
      <div class="orb one"></div>
      <div class="orb two"></div>

      <div class="content">
        <div class="panel">
          <div class="eyebrow">zero drag</div>
          <h1 class="gradient">gravityless</h1>
          <p>
            gravity gone. immersive motion, zero weight, endless orbit. Built for ideas that float,
            glide, and break free from the ordinary.
          </p>

          <div class="actions">
            <a class="btn primary" href="#">Launch</a>
            <a class="btn secondary" href="#">Explore</a>
          </div>

          <div class="stats" aria-label="Project details">
            <div class="stat">
              <div class="value">0g</div>
              <div class="label">weight</div>
            </div>
            <div class="stat">
              <div class="value">∞</div>
              <div class="label">motion</div>
            </div>
            <div class="stat">
              <div class="value">1</div>
              <div class="label">vision</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
